spring.application.name=ms-paciente
server.port=${PACIENTE_SERVER_PORT:0}
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework

# =========================================================
# Eureka
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# =========================================================
# Banco (fora do Docker; no Compose vem SPRING_DATASOURCE_*)
# =========================================================
spring.datasource.url=jdbc:postgresql://${PACIENTE_DB_HOST:localhost}:${PACIENTE_DB_PORT:5432}/${PACIENTE_DB_NAME:afit_paciente}
spring.datasource.username=${PACIENTE_DB_USER:afit_paciente}
spring.datasource.password=${PACIENTE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/common

# =========================================================
# Seguranca
# =========================================================
afitcenter.jwt.chave-publica=${AFIT_JWT_PUBLIC_KEY}
afitcenter.jwt.issuer=${AFIT_JWT_ISSUER}
afitcenter.seguranca.token-interno=${AFIT_INTERNAL_TOKEN}

# =========================================================
# RabbitMQ / outbox (eventos de paciente para as replicas)
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=simple
afitcenter.outbox.habilitado=true
afitcenter.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:1000}

# Limites do plano: replica da assinatura (ms-planos) alimentada por eventos assinatura.*
afitcenter.replica-assinatura.fila=ms-paciente.assinatura
# 3 tentativas com espera crescente; depois a mensagem vai para a DLQ da fila.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.cloud.openfeign.client.config.ms-planos.connect-timeout=2000
spring.cloud.openfeign.client.config.ms-planos.read-timeout=3000

# =========================================================
# Portal do paciente: codigo de acesso que liga a ficha a conta do paciente (ms-pessoa)
# =========================================================
afitcenter.portal.codigo-validade-horas=${PORTAL_CODIGO_VALIDADE_HORAS:72}
# Codigos errados por conta antes do bloqueio temporario
afitcenter.portal.max-falhas=5
afitcenter.portal.bloqueio-minutos=15

# Trilha de auditoria: registra tambem as leituras de prontuario (LGPD)
afitcenter.auditoria.leituras=true
# Catalogos sem dado pessoal
afitcenter.auditoria.leituras-ignoradas=/v1/tipos-condicao,/v1/condicoes

# =========================================================
# Swagger (so nos perfis local e homolog) / Actuator
# =========================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
