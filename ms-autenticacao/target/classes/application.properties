spring.application.name=ms-autenticacao
server.port=${AUTH_SERVER_PORT:0}
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework

# =========================================================
# Eureka
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# =========================================================
# Banco (fora do Docker; no Compose vem SPRING_DATASOURCE_*)
# =========================================================
spring.datasource.url=jdbc:postgresql://${AUTH_DB_HOST:localhost}:${AUTH_DB_PORT:5432}/${AUTH_DB_NAME:afit_auth}
spring.datasource.username=${AUTH_DB_USER:afit_auth}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/common

# =========================================================
# JWT (ES256): unico servico com a chave PRIVADA
# =========================================================
afitcenter.jwt.chave-privada=${AFIT_JWT_PRIVATE_KEY}
afitcenter.jwt.chave-publica=${AFIT_JWT_PUBLIC_KEY}
afitcenter.jwt.issuer=${AFIT_JWT_ISSUER}
afitcenter.jwt.validade-minutos=${AFIT_TOKEN_VALIDADE_MINUTOS:15}
afitcenter.seguranca.token-interno=${AFIT_INTERNAL_TOKEN}

# Tentativas de login com senha errada por e-mail antes do bloqueio temporario
afitcenter.login.max-falhas=${AFIT_LOGIN_MAX_FALHAS:5}
afitcenter.login.bloqueio-minutos=${AFIT_LOGIN_BLOQUEIO_MINUTOS:15}

# =========================================================
# Swagger (so nos perfis local e homolog) / Actuator
# =========================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
