spring.application.name=ms-pagamentos
server.port=${PAGAMENTOS_SERVER_PORT:0}
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework

# =========================================================
# Eureka
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# =========================================================
# Banco (fora do Docker; no Compose vem SPRING_DATASOURCE_*)
# =========================================================
spring.datasource.url=jdbc:postgresql://${PAGAMENTOS_DB_HOST:localhost}:${PAGAMENTOS_DB_PORT:5432}/${PAGAMENTOS_DB_NAME:afit_pagamentos}
spring.datasource.username=${PAGAMENTOS_DB_USER:afit_pagamentos}
spring.datasource.password=${PAGAMENTOS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/common

# =========================================================
# Seguranca
# =========================================================
afitcenter.jwt.chave-publica=${AFIT_JWT_PUBLIC_KEY}
afitcenter.jwt.issuer=${AFIT_JWT_ISSUER}
afitcenter.seguranca.token-interno=${AFIT_INTERNAL_TOKEN}

# =========================================================
# RabbitMQ / outbox (eventos cobranca.* e trilha de auditoria)
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=simple
afitcenter.outbox.habilitado=true
afitcenter.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:1000}

# =========================================================
# Provedor de pagamento
# =========================================================
# Provedor das novas cobrancas. So existe o SIMULADO: nenhuma cobranca e real ate plugar um provedor
# (implementacao de ProvedorPagamento) e trocar este valor.
afitcenter.pagamentos.provedor=${AFIT_PAGAMENTOS_PROVEDOR:SIMULADO}
# Segredo do HMAC das notificacoes do simulador (header X-Simulador-Assinatura). openssl rand -hex 32
afitcenter.pagamentos.simulador.segredo-webhook=${AFIT_PAGAMENTOS_WEBHOOK_SEGREDO:}
# Endpoints /v1/simulador/** (confirmar/recusar cobrancas). Ligados nos perfis local e homolog.
afitcenter.pagamentos.simulador.endpoints-habilitados=false
# Pendentes vencidas ha mais destes dias viram VENCIDA (o boleto compensa no dia seguinte)
afitcenter.pagamentos.dias-tolerancia-vencimento=${PAGAMENTOS_DIAS_TOLERANCIA:1}
afitcenter.pagamentos.agendador.intervalo-ms=${PAGAMENTOS_AGENDADOR_INTERVALO_MS:900000}

# =========================================================
# Swagger (so nos perfis local e homolog) / Actuator
# =========================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
