spring.application.name=service-registry
server.port=${SERVER_PORT:8761}

# O registry nao se registra nem busca o registro (instancia unica).
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:true}

# Basic auth exigida dos servicos e do painel. Use valores seguros em URL (ex.: hexadecimal).
spring.security.user.name=${EUREKA_USER}
spring.security.user.password=${EUREKA_PASSWORD}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
