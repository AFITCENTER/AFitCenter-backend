spring.application.name=ms-auditoria
server.port=${AUDITORIA_SERVER_PORT:0}
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework

# =========================================================
# Eureka
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# =========================================================
# Banco (fora do Docker; no Compose vem SPRING_DATASOURCE_*)
# =========================================================
spring.datasource.url=jdbc:postgresql://${AUDITORIA_DB_HOST:localhost}:${AUDITORIA_DB_PORT:5432}/${AUDITORIA_DB_NAME:afit_auditoria}
spring.datasource.username=${AUDITORIA_DB_USER:afit_auditoria}
spring.datasource.password=${AUDITORIA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/common

# =========================================================
# Seguranca
# =========================================================
afitcenter.jwt.chave-publica=${AFIT_JWT_PUBLIC_KEY}
afitcenter.jwt.issuer=${AFIT_JWT_ISSUER}
afitcenter.seguranca.token-interno=${AFIT_INTERNAL_TOKEN}

# =========================================================
# RabbitMQ: consome auditoria.* de todos os servicos
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=6
spring.rabbitmq.listener.simple.prefetch=50
# 3 tentativas com espera crescente; depois a mensagem vai para a DLQ da fila.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# =========================================================
# Retencao: registros mais antigos que isto sao apagados (0 = guardar para sempre)
# =========================================================
afitcenter.auditoria.retencao-dias=${AUDITORIA_RETENCAO_DIAS:1825}

# =========================================================
# Swagger (so nos perfis local e homolog) / Actuator
# =========================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
