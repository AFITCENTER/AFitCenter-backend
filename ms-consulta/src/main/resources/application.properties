spring.application.name=ms-consulta
server.port=${CONSULTA_SERVER_PORT:0}
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework

# =========================================================
# Eureka
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# =========================================================
# Banco (fora do Docker; no Compose vem SPRING_DATASOURCE_*)
# =========================================================
spring.datasource.url=jdbc:postgresql://${CONSULTA_DB_HOST:localhost}:${CONSULTA_DB_PORT:5432}/${CONSULTA_DB_NAME:afit_consulta}
spring.datasource.username=${CONSULTA_DB_USER:afit_consulta}
spring.datasource.password=${CONSULTA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/common

# =========================================================
# Seguranca
# =========================================================
afitcenter.jwt.chave-publica=${AFIT_JWT_PUBLIC_KEY}
afitcenter.jwt.issuer=${AFIT_JWT_ISSUER}
afitcenter.seguranca.token-interno=${AFIT_INTERNAL_TOKEN}

# =========================================================
# Replicas (paciente e consultorio) alimentadas por eventos
# =========================================================
afitcenter.replica-paciente.fila=ms-consulta.paciente
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=simple
afitcenter.outbox.habilitado=true
afitcenter.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:1000}
# 3 tentativas com espera crescente; depois a mensagem vai para a DLQ da fila.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Busca sincrona quando a replica ainda nao recebeu o evento
spring.cloud.openfeign.client.config.ms-paciente.connect-timeout=2000
spring.cloud.openfeign.client.config.ms-paciente.read-timeout=3000
spring.cloud.openfeign.client.config.ms-nutricionista.connect-timeout=2000
spring.cloud.openfeign.client.config.ms-nutricionista.read-timeout=3000

# Trilha de auditoria: registra tambem as leituras de prontuario (LGPD)
afitcenter.auditoria.leituras=true

# =========================================================
# Swagger (so nos perfis local e homolog) / Actuator
# =========================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
