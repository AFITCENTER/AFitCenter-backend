spring.application.name=ms-nutricionista
server.port=${NUTRICIONISTA_SERVER_PORT:0}
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework

# =========================================================
# Eureka
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# =========================================================
# Banco (fora do Docker; no Compose vem SPRING_DATASOURCE_*)
# =========================================================
spring.datasource.url=jdbc:postgresql://${NUTRICIONISTA_DB_HOST:localhost}:${NUTRICIONISTA_DB_PORT:5432}/${NUTRICIONISTA_DB_NAME:afit_nutricionista}
spring.datasource.username=${NUTRICIONISTA_DB_USER:afit_nutricionista}
spring.datasource.password=${NUTRICIONISTA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/common

# =========================================================
# Seguranca
# =========================================================
afitcenter.jwt.chave-publica=${AFIT_JWT_PUBLIC_KEY}
afitcenter.jwt.issuer=${AFIT_JWT_ISSUER}
afitcenter.seguranca.token-interno=${AFIT_INTERNAL_TOKEN}

# =========================================================
# Chamadas ao ms-pessoa (cadastro: dados pessoais e acesso)
# =========================================================
spring.cloud.openfeign.client.config.ms-pessoa.connect-timeout=2000
spring.cloud.openfeign.client.config.ms-pessoa.read-timeout=5000

# =========================================================
# RabbitMQ / outbox (eventos de consultorio)
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=simple
afitcenter.outbox.habilitado=true
afitcenter.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:1000}

# Limites do plano: replica da assinatura (ms-planos) alimentada por eventos assinatura.*
afitcenter.replica-assinatura.fila=ms-nutricionista.assinatura
# 3 tentativas com espera crescente; depois a mensagem vai para a DLQ da fila.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.cloud.openfeign.client.config.ms-planos.connect-timeout=2000
spring.cloud.openfeign.client.config.ms-planos.read-timeout=3000

# =========================================================
# Swagger (so nos perfis local e homolog) / Actuator
# =========================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
