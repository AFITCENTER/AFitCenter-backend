# Perfil de desenvolvimento local. Nunca use em homologacao ou producao.
# Carrega as pessoas ficticias (senha conhecida) de db/migration/local.
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/local
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
server.error.include-message=always
management.endpoint.health.show-details=always
# E-mails so no log, com o texto inteiro (inclusive o link com o token)
afitcenter.email.provedor=${AFIT_EMAIL_PROVEDOR:LOG}
afitcenter.email.log.completo=true
