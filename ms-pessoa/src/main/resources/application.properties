spring.application.name=ms-pessoa
server.port=${PESSOA_SERVER_PORT:0}
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework

# =========================================================
# Eureka
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# =========================================================
# Banco (fora do Docker; no Compose vem SPRING_DATASOURCE_*)
# =========================================================
spring.datasource.url=jdbc:postgresql://${PESSOA_DB_HOST:localhost}:${PESSOA_DB_PORT:5432}/${PESSOA_DB_NAME:afit_pessoa}
spring.datasource.username=${PESSOA_DB_USER:afit_pessoa}
spring.datasource.password=${PESSOA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/common

# =========================================================
# JWT (ES256): unico servico com a chave PRIVADA
# =========================================================
afitcenter.jwt.chave-privada=${AFIT_JWT_PRIVATE_KEY}
afitcenter.jwt.chave-publica=${AFIT_JWT_PUBLIC_KEY}
afitcenter.jwt.issuer=${AFIT_JWT_ISSUER}
afitcenter.jwt.validade-minutos=${AFIT_TOKEN_VALIDADE_MINUTOS:15}
afitcenter.seguranca.token-interno=${AFIT_INTERNAL_TOKEN}

# Senhas erradas por e-mail (login e cadastro numa conta existente) antes do bloqueio temporario
afitcenter.login.max-falhas=${AFIT_LOGIN_MAX_FALHAS:5}
afitcenter.login.bloqueio-minutos=${AFIT_LOGIN_BLOQUEIO_MINUTOS:15}

# =========================================================
# E-mail: recuperacao de senha e confirmacao do e-mail
# =========================================================
# SMTP envia de verdade e exige AFIT_SMTP_HOST e AFIT_EMAIL_REMETENTE (sem eles o servico nao sobe).
# LOG nao envia nada, so registra no log; e o padrao nos perfis local e homolog.
afitcenter.email.provedor=${AFIT_EMAIL_PROVEDOR:SMTP}
afitcenter.email.remetente=${AFIT_EMAIL_REMETENTE:}
afitcenter.email.smtp.host=${AFIT_SMTP_HOST:}
afitcenter.email.smtp.porta=${AFIT_SMTP_PORT:587}
afitcenter.email.smtp.usuario=${AFIT_SMTP_USUARIO:}
afitcenter.email.smtp.senha=${AFIT_SMTP_SENHA:}
afitcenter.email.smtp.starttls=${AFIT_SMTP_STARTTLS:true}
# Frontend que recebe os links: <url>/redefinir-senha#token=... e <url>/confirmar-email#token=...
afitcenter.email.url-frontend=${AFIT_FRONTEND_URL:http://localhost:5173}
# Validade dos links (uso unico; o banco guarda so o hash)
afitcenter.senha.redefinicao.validade-minutos=${AFIT_SENHA_LINK_VALIDADE_MINUTOS:30}
afitcenter.email.confirmacao.validade-horas=48
# E-mails com link por endereco ("esqueci a senha" e reenvio da confirmacao) dentro da janela
afitcenter.email.max-envios=5
afitcenter.email.janela-minutos=60
# Envio assincrono: no desligamento, espera os e-mails pendentes
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=10s

# =========================================================
# RabbitMQ / outbox (trilha de auditoria: logins, cadastros e alteracoes de conta)
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=simple
afitcenter.outbox.habilitado=true
afitcenter.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:1000}

# =========================================================
# Swagger (so nos perfis local e homolog) / Actuator
# =========================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
