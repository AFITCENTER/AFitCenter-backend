spring.application.name=gateway
spring.main.web-application-type=reactive
server.port=${GATEWAY_PORT:8080}

# =========================================================
# Eureka
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# Discovery Locator desligado: so as rotas de GatewayConfig (com JwtAuthFilter) ficam expostas.
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# =========================================================
# JWT: somente a chave PUBLICA. O Gateway valida, mas nao emite tokens.
# =========================================================
afitcenter.jwt.chave-publica=${AFIT_JWT_PUBLIC_KEY}
afitcenter.jwt.issuer=${AFIT_JWT_ISSUER}

# =========================================================
# CORS / documentacao
# =========================================================
afitcenter.cors.origens-permitidas=${AFIT_CORS_ALLOWED_ORIGINS:}
# Rotas publicas para o Swagger de cada servico; so no perfil local.
afitcenter.docs.habilitado=false

# =========================================================
# Actuator / logs
# =========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.org.springframework.cloud.gateway=INFO
