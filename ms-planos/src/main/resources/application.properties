spring.application.name=ms-planos
server.port=${PLANOS_SERVER_PORT:0}
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=framework

# =========================================================
# Eureka
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_URL}
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# =========================================================
# Banco (fora do Docker; no Compose vem SPRING_DATASOURCE_*)
# =========================================================
spring.datasource.url=jdbc:postgresql://${PLANOS_DB_HOST:localhost}:${PLANOS_DB_PORT:5432}/${PLANOS_DB_NAME:afit_planos}
spring.datasource.username=${PLANOS_DB_USER:afit_planos}
spring.datasource.password=${PLANOS_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/common

# =========================================================
# Seguranca
# =========================================================
afitcenter.jwt.chave-publica=${AFIT_JWT_PUBLIC_KEY}
afitcenter.jwt.issuer=${AFIT_JWT_ISSUER}
afitcenter.seguranca.token-interno=${AFIT_INTERNAL_TOKEN}

# =========================================================
# RabbitMQ: publica assinatura.* (outbox) e consome cobranca.*
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=simple
afitcenter.outbox.habilitado=true
afitcenter.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:1000}
# 3 tentativas com espera crescente; depois a mensagem vai para a DLQ da fila.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Cobrancas no ms-pagamentos
spring.cloud.openfeign.client.config.ms-pagamentos.connect-timeout=2000
spring.cloud.openfeign.client.config.ms-pagamentos.read-timeout=10000

# =========================================================
# Ciclo das assinaturas
# =========================================================
# Vencimento das cobrancas de mudanca de plano e das novas cobrancas (dias a partir de hoje)
afitcenter.planos.dias-vencimento=${PLANOS_DIAS_VENCIMENTO:3}
# A fatura de renovacao e emitida esta quantidade de dias antes do fim do periodo pago
afitcenter.planos.dias-antecedencia-renovacao=${PLANOS_DIAS_ANTECEDENCIA_RENOVACAO:7}
# Dias como INADIMPLENTE (limites mantidos) antes da suspensao (limites do plano padrao)
afitcenter.planos.dias-carencia=${PLANOS_DIAS_CARENCIA:7}
afitcenter.planos.agendador.intervalo-ms=${PLANOS_AGENDADOR_INTERVALO_MS:600000}

# =========================================================
# Swagger (so nos perfis local e homolog) / Actuator
# =========================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
